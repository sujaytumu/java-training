spring.application.name=week-03-employee-management
spring.profiles.default=local
server.port=8080
app.company-name=Week 3 Employee Management
app.employee-code-prefix=EMP
app.features.attendance=true
app.features.welcome-banner=true
security.jwt.secret=${JWT_SECRET:V2Vla0NUb3RhbGx5RGVtb1NlY3JldEtleUZvckpXVFRyYWluaW5nISE=}
